[package]
name = "digital-bypass"
version = "0.1.0"
description = "Multitool for bypassing network blocks: zapret2 (winws2), DNS and more"
authors = ["digital-bombyx"]
license = "GPL-3.0-only"
repository = "https://github.com/digital-bombyx/digital-bypass"
edition = "2021"

[lib]
name = "digital_bypass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
socket2 = "0.6"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
# TLS для DoH и диагностики: ring вместо aws-lc (не нужен cmake/nasm), корни — из хранилища Windows.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
# Telegram (MTProto obfuscated2): AES-256 (CTR поверх блочного шифра), SHA-256, случайные числа.
aes = "0.8"
sha2 = "0.10"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
# Управление памятью WebView2 при сворачивании (те же версии, что тянет Tauri).
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_System_Registry",
  "Win32_Globalization",
  "Win32_Networking_WinInet",
  "Win32_Networking_WinSock",
  "Win32_UI_Shell",
] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
